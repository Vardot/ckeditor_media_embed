site_name: "CKEditor Media Embed Plugin"
repo_url: https://git.drupalcode.org/project/ckeditor_media_embed
repo_name: drupal/ckeditor_media_embed
edit_uri: /-/edit/2.x/docs/

theme:
  name: material
  language: en
  # favicon: favicon.ico
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: indigo
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: indigo
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: indigo
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.sections
    # - navigation.expand

nav:
  - Introduction: "index.md"
  - User Documentation:
      - Installation and Setup: "1-users/0-installation.md"
      - Embedding Media: "1-users/1-embedding-media.md"
      - Supported Providers and What Renders: "1-users/2-supported-providers.md"
  - Administrator Documentation:
      - Configuration: "2-admins/0-configuration.md"
      - Text Formats and Allowed HTML: "2-admins/1-text-formats.md"
      - The CKEditor 5 Plugin Library: "2-admins/2-plugin-library.md"
      - Upgrading: "2-admins/3-upgrading.md"
  - Developer Documentation:
      - Architecture: "3-developers/0-architecture.md"
      - Hooks and Extension Points: "3-developers/1-hooks-and-extension-points.md"
      - The Root-Relative Plugin Path: "3-developers/2-root-relative-plugin-path.md"
  - Testing:
      - Testing Overview: "4-testing/0-overview.md"
      - Automated Functional Acceptance Testing: "4-testing/1-automated-functional-acceptance-testing.md"
      - Running Tests: "4-testing/2-running-tests.md"
      - GitLab CI: "4-testing/3-gitlab-ci.md"
      - PHPUnit: "4-testing/4-phpunit.md"
  - Frequently Asked Questions: "faq.md"

plugins:
  - search
  - privacy:
      enabled: !ENV [CI, false]

markdown_extensions:
  # - markdown.extensions.admonition
  - pymdownx.extra
